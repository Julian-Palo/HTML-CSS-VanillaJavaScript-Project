      <figure>
        <img
          src="img/tacos_close_up_400x260.png"
          alt="More tacos! Birria are the best"
          title="Our tacos"
          width="400"
          height="260"
        />
        <figcaption>Little Taco Shop Tacos</figcaption>
      </figure>

      <article id="contact">
        <h2>Our Contact Form</h2>

        <form id="message-form" action="https://httpbin.org/get" method="get">
          <fieldset>
            <div class="mb-3">
              <label for="firstName">Name:</label>
              <input
                type="text"
                name="Name"
                id="firstName"
                placeholder="Jane Doe"
                autocomplete="on"
                required
                autofocus
                class="form-control"
              />
            </div>

            <div class="mb-3">
              <label for="email">Email:</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="janedoe@gmail.com"
                autocomplete="on"
                required
                class="form-control"
              />
            </div>

            <div class="mb-3">
              <label for="message">Message: </label>
              <textarea
                name="message"
                id="message"
                placeholder="Type your message"
                class="form-control"
              ></textarea>
            </div>
          </fieldset>

          <!-- Wrap the buttons in a div to control their layout -->
          <div class="button-group">
            <button type="submit" class="message-form-btn">Submit</button>
            <button type="reset" class="message-form-btn">Reset</button>
          </div>
        </form>
      </article>

      <section>
        <h2>Our Location</h2>
        <address>
          555 Taco Temptation Lane, Suite T
          <br />
          Kansas City, MO 55555-5555
          <br />
          <br />
          Phone: <a href="tel:+5555555555">555-555-5555</a>
        </address>
      </section>

      <hr />
      <p>Copyright &copy; The little Taco Shop</p>
      <br />

        <a href="#">Back to Top</a>
      </p>
