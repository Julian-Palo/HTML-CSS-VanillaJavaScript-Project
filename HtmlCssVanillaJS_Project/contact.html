<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Julian Palomino" />
    <meta
      name="description"
      content="This page shows where the user may contact us"
    />
    <title>Contact</title>
    <link rel="icon" href="favicon.ico" type="ico/x-icon" />
    <link rel="stylesheet" href="css/style.css" type="text/css" />
  </head>
  <body>
    <main>
      <h1>Contact Us</h1>
      <!--TODO: add hrefs for respective list instance-->
      <nav aria-label="primary-navigation">
        <ul>
          <li>
            <a href="/index.html">Home</a>
          </li>
          <li>
            <a href="index.html#about">About LTS</a>
          </li>
          <li>
            <a href="index.html#menu">Our Menu</a>
          </li>
          <li>
            <a href="/hours.html">Store Hours</a>
          </li>
        </ul>
      </nav>

      <figure>
        <img
          src="img/tacos_close_up_400x260.png"
          alt="More tacos! Birria are the best"
          title="Our tacos"
          width="400"
          height="260"
        />
        <figcaption>Little Taco Shop Tacos</figcaption>
      </figure>

      <article id="contact">
        <h2>Our Contact Form</h2>

        <form action="https://httpbin.org/get" method="get">
          <fieldset>
            <legend>Send Us A Message</legend>
            <!--we wrap the label inputs in paragraphs to space them out instead of wrapping against each other-->
            <p>
              <label for="firstName">Name:</label>
              <!--autofocus highlights the box to let the user text in it as soon as the page loads.
          
          It's usually not a good element to put in if your contact me is at the bottom of your page, just be aware of that.we're doing it to show you how it works-->

              <input
                type="text"
                name="Name"
                id="firstName"
                placeholder="Jane Doe"
                autocomplete="on"
                required
                autofocus
              />
            </p>
            <p>
              <label for="email">Email:</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="janedoe@gmail.com"
                autocomplete="on"
                required
              />
            </p>

            <label for="message">Your Message:</label>
            <br />
            <textarea
              name="message"
              id="message"
              cols="30"
              rows="10"
              placeholder="Type your message"
            ></textarea>
          </fieldset>
          <button type="submit">Submit</button>

          <button type="reset">Reset</button>
        </form>
      </article>

      <section>
        <h2>Our Location</h2>
        <address>
          555 Taco Temptation Lane, Suite T
          <br />
          Kansas City, MO 55555-5555
          <br />
          <br />
          Phone: <a href="tel:+5555555555">555-555-5555</a>
        </address>
      </section>

      <hr />
      <p>Copyright &copy; The little Taco Shop</p>
      <br />
      <p>
        <a href="#">Back to Top</a>
      </p>
    </main>
  </body>
</html>
